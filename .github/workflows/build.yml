name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    # Built on Windows, so both are checked: this catches path and
    # line-ending differences that only show up on one of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Git Bash on the Windows runner, so ./mvnw works on both.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The tests never start a JavaFX toolkit, so no display is needed.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify
